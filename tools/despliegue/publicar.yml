# Publicación automática de la web en vibrastreetfood.com (hosting de FastComet, por FTPS).
#
# ESTE ARCHIVO AQUÍ NO HACE NADA: es la plantilla. Para activarla hay que copiarla a
# .github/workflows/publicar.yml, y solo cuando existan en GitHub los tres secretos
# (Settings → Secrets and variables → Actions → New repository secret):
#
#   FTP_SERVER     nombre del servidor de FastComet (el que enseña cPanel en "Cuentas de FTP")
#   FTP_USERNAME   usuario de la cuenta FTP creada solo para esto, encerrada en la carpeta de la web
#   FTP_PASSWORD   su contraseña (la escribe Ivan; nadie más la ve)
#
# Desde ese momento, cada cambio que llegue a la rama main se sube solo (solo los archivos que cambian).
# No borra nada que no haya subido ella misma y nunca vacía la carpeta (dangerous-clean-slate está apagado).

name: Publicar en vibrastreetfood.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Subir a FastComet por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # La cuenta FTP ya está encerrada en la carpeta de la web: se sube a su raíz.
          server-dir: ./
          # Lo que NO se publica: herramientas, notas internas y configuración de GitHub.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .claude/**
            tools/**
            _config.yml
            vibra-guion-de-arranque.md
