# Publicación automática de la web en vibrastreetfood.com (hosting de FastComet, por FTPS).
#
# Activa desde el 18/9/2026. Cada cambio que llega a la rama main se sube solo (solo los archivos que cambian).
# No borra nada que no haya subido ella misma y nunca vacía la carpeta (dangerous-clean-slate está apagado).
#
# Usa tres secretos del repositorio (Settings → Secrets and variables → Actions):
#
#   FTP_SERVER     nombre del servidor de FastComet
#   FTP_USERNAME   cuenta FTP creada solo para esto en el cPanel, encerrada en la carpeta de la web
#   FTP_PASSWORD   su contraseña (la escribió Ivan; nadie más la ve)
#
# Si se cambia la contraseña de esa cuenta en cPanel, hay que actualizar FTP_PASSWORD aquí o dejará de publicar.
# Para publicar a mano sin cambiar nada: pestaña Actions → "Publicar en vibrastreetfood.com" → Run workflow.

name: Publicar en vibrastreetfood.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Subir a FastComet por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # La cuenta FTP ya está encerrada en la carpeta de la web: se sube a su raíz.
          server-dir: ./
          # Lo que NO se publica: herramientas, notas internas y configuración de GitHub.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .claude/**
            tools/**
            _config.yml
            vibra-guion-de-arranque.md
